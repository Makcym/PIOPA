<!DOCTYPE html>
<html>
<head>
  <title>PIO Application Checker - Settings</title>
  <style>
    body {
      width: 600px;
      margin: 20px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    #save {
      background: #4CAF50;
      color: white;
    }
    #save:hover {
      background: #45a049;
    }
    #testConnection {
      background: #2196F3;
      color: white;
      padding: 8px 15px;
    }
    #testConnection:hover {
      background: #1976D2;
    }
    .success-message {
      color: #4CAF50;
      margin-top: 10px;
      display: none;
    }
    .error-message {
      color: #f44336;
      margin-top: 10px;
      display: none;
    }
    .applications-list {
      margin-top: 20px;
      display: none;
    }
    .applications-list h3 {
      margin-bottom: 10px;
    }
    .application-item {
      padding: 10px;
      margin: 5px 0;
      background-color: #f8f9fa;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .application-item:hover {
      background-color: #e9ecef;
      transform: translateY(-2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .application-number {
      font-weight: bold;
      color: #2c3e50;
    }
    .application-date {
      color: #7f8c8d;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h2>PIO News Checker Settings</h2>
  
  <div class="form-group">
    <label for="username">Email:</label>
    <input type="text" id="username" placeholder="Enter your email">
  </div>
  
  <div class="form-group">
    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter your password">
  </div>
  
  <div class="form-group">
    <label for="applications">Application Numbers:</label>
    <input type="text" id="applications" placeholder="Enter application numbers separated by commas">
  </div>
  
  <div>
    <button id="testConnection">Get Applications</button>
  </div>
  
  <div id="successMessage" class="success-message">Settings saved successfully!</div>
  <div id="errorMessage" class="error-message"></div>
  
  <div id="applicationsList" class="applications-list">
    <h3>Available Applications:</h3>
    <div id="applicationsListContent"></div>
  </div>

  <div class="button-group">
    <button id="save">Save Settings</button>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
