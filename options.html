<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PIO Application Checker</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { max-width: 620px; margin: 0 auto; padding: 28px 20px 40px; }
    h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 28px; height: 28px; }
    .lead { color: var(--mute); margin: 0 0 22px; }
    .group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    .hint { font-size: 12.5px; color: var(--mute); margin-top: 5px; }
    input[type="text"], input[type="password"], select {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--ink); font: inherit;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .apps { margin-top: 12px; display: none; }
    .apps h2 { font-size: 14px; margin: 0 0 8px; }
    .app { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 11px; margin-bottom: 6px; background: var(--panel); border-radius: 8px; }
    .app-number { font-weight: 700; }
    .app-date { color: var(--mute); font-size: 12.5px; margin-left: 8px; }
    .foot { display: flex; align-items: center; gap: 14px; margin-top: 26px; }
    .ok { color: var(--ok-ink); display: none; }
    .err { color: var(--bad-ink); background: var(--bad-bg); padding: 8px 10px; border-radius: 8px; margin-top: 10px; display: none; }
    .privacy { margin-top: 26px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; color: var(--mute); }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1><img src="icons/icon-48.png" alt=""><span data-i18n="optionsTitle">Settings</span></h1>
  <p class="lead" data-i18n="optionsLead"></p>

  <div class="group">
    <label for="username" data-i18n="email">Email</label>
    <input type="text" id="username" autocomplete="username" data-i18n-placeholder="emailPlaceholder">
  </div>
  <div class="group">
    <label for="password" data-i18n="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" data-i18n-placeholder="passwordPlaceholder">
  </div>
  <div class="group">
    <label for="applications" data-i18n="applications">Application numbers</label>
    <input type="text" id="applications" data-i18n-placeholder="applicationsPlaceholder">
    <div class="hint" data-i18n="applicationsHint"></div>
  </div>

  <button id="testConnection" class="btn blue" data-i18n="getApplications">Get applications</button>
  <div id="errorMessage" class="err"></div>
  <div id="applicationsList" class="apps">
    <h2 data-i18n="availableApplications">Available applications</h2>
    <div id="applicationsListContent"></div>
  </div>

  <div class="row" style="margin-top: 24px;">
    <div class="group">
      <label for="newsPeriod" data-i18n="newsPeriod">Show messages for</label>
      <select id="newsPeriod">
        <option value="all" data-i18n="period_all">All time</option>
        <option value="5y" data-i18n="period_5y">5 years</option>
        <option value="4y" data-i18n="period_4y">4 years</option>
        <option value="3y" data-i18n="period_3y" selected>3 years</option>
        <option value="2y" data-i18n="period_2y">2 years</option>
        <option value="1y" data-i18n="period_1y">1 year</option>
        <option value="6m" data-i18n="period_6m">6 months</option>
        <option value="1m" data-i18n="period_1m">1 month</option>
        <option value="1w" data-i18n="period_1w">1 week</option>
        <option value="3d" data-i18n="period_3d">3 days</option>
        <option value="1d" data-i18n="period_1d">1 day</option>
        <option value="5h" data-i18n="period_5h">5 hours</option>
      </select>
    </div>
    <div class="group">
      <label for="autoUpdatePeriod" data-i18n="autoUpdate">Check every</label>
      <select id="autoUpdatePeriod">
        <option value="0.5" data-i18n="every_30m">30 minutes</option>
        <option value="1" data-i18n="every_1h">1 hour</option>
        <option value="2" data-i18n="every_2h">2 hours</option>
        <option value="3" data-i18n="every_3h" selected>3 hours</option>
        <option value="5" data-i18n="every_5h">5 hours</option>
        <option value="10" data-i18n="every_10h">10 hours</option>
      </select>
    </div>
  </div>

  <div class="foot">
    <button id="save" class="btn primary" data-i18n="save">Save</button>
    <span id="successMessage" class="ok" data-i18n="saved">Saved</span>
  </div>

  <div class="privacy" data-i18n="privacyNote"></div>

  <script src="core.js"></script>
  <script src="options.js"></script>
</body>
</html>
