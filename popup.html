<!DOCTYPE html>
<html>
<head>
  <title>PIO Application Checker</title>
  <style>
    body {
      width: 400px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .header-buttons {
      display: flex;
      gap: 10px;
    }
    .settings-button, .refresh-button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }
    .refresh-button {
      background: #2196F3;
    }
    .settings-button:hover {
      background: #45a049;
    }
    .refresh-button:hover {
      background: #1976D2;
    }
    #status {
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 4px;
    }
    .success {
      background-color: #dff0d8;
      color: #3c763d;
    }
    .error {
      background-color: #f2dede;
      color: #a94442;
    }
    .news-list {
      max-height: 400px;
      overflow-y: auto;
    }
    .news-item {
      padding: 10px;
      margin-bottom: 8px;
      background-color: #f8f9fa;
      border-radius: 4px;
      transition: all 0.3s ease;
    }
    .news-item:hover {
      background-color: #e9ecef;
      transform: translateY(-2px);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .news-title {
      display: block;
      font-weight: bold;
      color: #2c3e50;
      text-decoration: none;
      margin-bottom: 5px;
    }
    .news-title:hover {
      color: #3498db;
    }
    .news-date {
      font-size: 12px;
      color: #7f8c8d;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 20px;
    }
    .no-news {
      text-align: center;
      color: #666;
      padding: 20px;
    }
    .settings-required {
      text-align: center;
      color: #666;
      padding: 20px;
      background-color: #f8f9fa;
      border-radius: 4px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>PIO Application Checker</h2>
    <div class="header-buttons">
      <button id="refreshButton" class="refresh-button">Refresh</button>
      <button id="settingsButton" class="settings-button">Settings</button>
    </div>
  </div>
  <div id="status"></div>
  <div id="newsList" class="news-list"></div>
  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
